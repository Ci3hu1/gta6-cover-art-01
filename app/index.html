<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm Heat Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Palm Heat</h1>
    <p class="tag">Your photos into GTA-style multi-panel cover art. Runs offline — nothing leaves your machine.</p>
    <label>Your photo <input id="photo" type="file" accept="image/*"></label>
    <label>Title <input id="caption" type="text" maxlength="40" value="PALM HEAT"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="60" value="a sunset story in Leonida"></label>
    <label>Layout <select id="layout"></select></label>
    <label>Colour grade <select id="grade"></select></label>
    <label>Export size
      <select id="size">
        <option value="1080x1080">Square 1080 x 1080</option>
        <option value="1080x1350">Story 1080 x 1350</option>
        <option value="1920x1080">Wide 1920 x 1080</option>
      </select>
    </label>
    <fieldset class="panels">
      <legend>Photo in each panel</legend>
      <label>Hero <select class="panel-pick" data-slot="0"></select></label>
      <label>Panel 2 <select class="panel-pick" data-slot="1"></select></label>
      <label>Panel 3 <select class="panel-pick" data-slot="2"></select></label>
      <label>Panel 4 <select class="panel-pick" data-slot="3"></select></label>
      <label>Panel 5 <select class="panel-pick" data-slot="4"></select></label>
    </fieldset>
    <p class="hint">Drag a panel to reframe it, scroll on it to zoom. Faces are never cropped out.</p>
    <div class="row">
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="export" type="button" class="primary">Export PNG</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1280" height="720" aria-label="The cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
