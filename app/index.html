<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm Heat Cover Studio — GTA 6-style cover maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>PALM HEAT <span>Cover Studio</span></h1>
  <p class="tagline">Turn any photo into GTA 6-style cover art — offline, in your browser.</p>
</header>

<main id="editor" class="editor">
  <section class="controls">
    <div class="control-row">
      <label>Caption
        <input id="captionInput" type="text" value="PALM HEAT" maxlength="24">
      </label>
      <label>Subtitle
        <input id="subtitleInput" type="text" value="Vice City Nights" maxlength="40">
      </label>
    </div>
    <div class="control-row">
      <label>Grade
        <select id="gradeSelect"></select>
      </label>
      <label>Layout
        <select id="layoutSelect"></select>
      </label>
      <label>Export size
        <select id="sizeSelect"></select>
      </label>
    </div>
    <div class="control-row buttons">
      <button id="undoBtn" type="button">↩ Undo</button>
      <button id="redoBtn" type="button">↪ Redo</button>
      <button id="exportBtn" type="button" class="primary">⬇ Export PNG</button>
      <label class="upload">＋ Add your photo
        <input id="uploadInput" type="file" accept="image/*" hidden>
      </label>
    </div>
    <p class="hint">Pick a panel below to change its photo, focus and zoom. Everything stays on your machine — no uploads, no network.</p>
    <div id="panels" class="panels"></div>
  </section>

  <section class="stage">
    <canvas id="preview" width="640" height="640" aria-label="Cover preview"></canvas>
    <p id="sizeLabel" class="size-label"></p>
  </section>
</main>

<!-- Screenshot scenes (hidden unless ?shot= is set) -->
<canvas id="shotCanvas" style="display:none"></canvas>
<div id="layoutsGrid" class="layouts-grid" style="display:none"></div>

<script type="module" src="src/shots.js"></script>
</body>
</html>
